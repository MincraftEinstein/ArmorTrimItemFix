modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "All right reserved"
issueTrackerURL="https://github.com/MincraftEinstein/ArmorTrimItemFix/issues"

[[mods]]
    modId = "armortrimitemfix"
    version = "${version}"
    displayName = "Armor Trim Item Fix"
    #updateJSONURL="https://change.me.example.invalid/updates.json"
    displayURL = "https://curseforge.com/minecraft/mc-mods/armor-trim-item-fix"
    iconFile = "pack.png"
    bannerFile = "pack.png"
    logoFile = "pack.png"
    authors = "${mod_author}"
    description = "${description}"

[modproperties.modmenu]
    sources = "https://github.com/MincraftEinstein/ArmorTrimItemFix"
    links = [
        "mod_menu.modrinth=https://modrinth.com/mod/armor-trim-item-fix",
        "mod_menu.curseforge=https://curseforge.com/minecraft/mc-mods/armor-trim-item-fix",
        "mod_menu.discord=https://discord.gg/gSsaFAvrBM",
        "mod_menu.kofi=https://ko-fi.com/mincrafteinstein"
    ]

[[mixins]]
    config = "${mod_id}.mixins.json"

[[dependencies.armortrimitemfix]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoforge_version}"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.armortrimitemfix]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version}, ${max_minecraft_version})"
    ordering = "NONE"
    side = "CLIENT"
